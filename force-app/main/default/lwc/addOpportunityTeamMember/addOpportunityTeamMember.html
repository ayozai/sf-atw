<!--
    @description    LWC Modal for the Opportunity Team Self-Service feature (IACRM-90).
                    Exposes two tabs:
                      - Tab 1 : Add a new Opportunity Team Member.
                      - Tab 2 : View and edit roles of existing members.
                    Launched via a Quick Action on the Opportunity record page.
    @author         MGHARIANI
    @date           2026-04-10
-->
<template>
    <lightning-card title={labels.title} icon-name="utility:groups">

        <!-- ── Global Error Banner ──────────────────────────────────────────── -->
        <template lwc:if={errorMessage}>
            <div class="slds-m-around_medium">
                <lightning-alert
                    label={labels.errorTitle}
                    message={errorMessage}
                    variant="error">
                </lightning-alert>
            </div>
        </template>

        <!-- ── Tabs ─────────────────────────────────────────────────────────── -->
        <lightning-tabset active-tab-value={activeTab} onactive={handleTabChange}>

            <!-- ─── Tab 1 : Add Member ──────────────────────────────────────── -->
            <lightning-tab label={labels.tabAdd} value="add" icon-name="utility:add">
                <div class="slds-m-around_medium">

                    <!-- User Lookup -->
                    <lightning-record-picker
                        label={labels.labelUser}
                        placeholder="Search active users…"
                        object-api-name="User"
                        filter={userFilter}
                        value={selectedUserId}
                        onchange={handleUserSelect}
                        class="slds-m-bottom_medium">
                    </lightning-record-picker>

                    <!-- Role Combobox (optional) -->
                    <lightning-combobox
                        label={labels.labelRole}
                        value={selectedRole}
                        options={roleOptions}
                        placeholder={labels.rolePlaceholder}
                        onchange={handleRoleChange}
                        class="slds-m-bottom_medium">
                    </lightning-combobox>

                    <!-- Access Level (read-only, always Edit) -->
                    <div class="slds-form-element slds-m-bottom_medium">
                        <label class="slds-form-element__label">{labels.labelAccess}</label>
                        <div class="slds-form-element__control">
                            <span class="slds-form-element__static slds-text-color_weak">
                                {labels.labelAccessValue}
                            </span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="slds-grid slds-gutters slds-m-top_medium">
                        <div class="slds-col slds-shrink">
                            <lightning-button
                                label={labels.buttonCancel}
                                onclick={handleCancel}
                                disabled={isLoading}>
                            </lightning-button>
                        </div>
                        <div class="slds-col slds-shrink">
                            <lightning-button
                                variant="brand"
                                label={labels.buttonAdd}
                                onclick={handleAddMember}
                                disabled={isAddDisabled}>
                            </lightning-button>
                        </div>
                    </div>

                    <!-- Spinner -->
                    <template lwc:if={isLoading}>
                        <lightning-spinner
                            alternative-text="Loading…"
                            size="small"
                            class="slds-m-top_medium">
                        </lightning-spinner>
                    </template>

                </div>
            </lightning-tab>

            <!-- ─── Tab 2 : Current Members ─────────────────────────────────── -->
            <lightning-tab label={labels.tabCurrent} value="current" icon-name="utility:people">
                <div class="slds-m-around_medium">

                    <!-- Loading state -->
                    <template lwc:if={isLoadingMembers}>
                        <lightning-spinner alternative-text="Loading members…" size="small"></lightning-spinner>
                    </template>

                    <!-- Empty state -->
                    <template lwc:elseif={hasNoMembers}>
                        <p class="slds-text-color_weak">{labels.noMembers}</p>
                    </template>

                    <!-- Members table with inline role editing -->
                    <template lwc:else>
                        <lightning-datatable
                            key-field="Id"
                            data={teamMembers}
                            columns={columns}
                            draft-values={draftValues}
                            onsave={handleSaveRoles}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </template>

                </div>
            </lightning-tab>

        </lightning-tabset>
    </lightning-card>
</template>
