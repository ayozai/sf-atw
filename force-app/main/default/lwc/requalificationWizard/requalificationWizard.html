<template>
    <lightning-quick-action-panel header="Requalification">

        <template if:false={isSubmitting}>
            <div class="slds-p-around_medium">
                <p class="slds-m-bottom_medium">
                    This action will set the current opportunity to <strong>Requalification</strong>
                    and create new <strong>Global Renewal</strong> opportunities
                    linked to the same framework contract.
                </p>
                <lightning-input
                    type="number"
                    label="Number of renewal opportunities to create"
                    min="1"
                    step="1"
                    value={numberOfOpps}
                    onchange={handleNumberChange}
                    required>
                </lightning-input>
                <template if:true={errorMessage}>
                    <p class="slds-text-color_error slds-m-top_x-small">{errorMessage}</p>
                </template>
            </div>
        </template>

        <template if:true={isSubmitting}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
                <p class="slds-m-top_small">Processing in background — you will receive a notification when done.</p>
            </div>
        </template>

        <div slot="footer">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                disabled={isSubmitting}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Confirm"
                onclick={handleConfirm}
                disabled={isSubmitting}>
            </lightning-button>
        </div>

    </lightning-quick-action-panel>
</template>
